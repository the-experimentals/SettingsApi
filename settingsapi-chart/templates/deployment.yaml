apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "settingsapi-chart.fullname" . }}
  labels:
    {{- include "settingsapi-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "settingsapi-chart.selectorLabels" . | nindent 6 }}
      app: {{ include "settingsapi-chart.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "settingsapi-chart.selectorLabels" . | nindent 8 }}
        app: {{ include "settingsapi-chart.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "settingsapi-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5004
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /settings/actuator/health/liveness
          #     port: http
          #   initialDelaySeconds: 30
          #   failureThreshold: 5
          #   periodSeconds: 30
          # readinessProbe:
          #   httpGet:
          #     path: /settings/actuator/health/rediness
          #     port: http
          #   initialDelaySeconds: 30
          #   failureThreshold: 5
          #   periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
