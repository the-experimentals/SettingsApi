plugins {
	id 'org.springframework.boot' version '2.4.5'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'org.asciidoctor.convert' version '1.5.8'
	id 'java'
	id 'com.google.protobuf' version '0.8.16'
}

apply plugin: 'java'
apply plugin: 'com.google.protobuf'

group = 'com.tmsolution'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '16'

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

sourceSets {
	src {
		main {
			proto{
				srcDir 'src/main/protos'
			}
			java {
				srcDirs 'build/generated/source/proto/main/grpc'
				srcDirs 'build/generated/source/proto/main/java'
			}
		}
	}
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1'
	implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.4.0-b180830.0359'
	implementation group: 'org.modelmapper', name: 'modelmapper', version: '2.4.2'

	implementation group: 'io.grpc', name: 'grpc-netty', version: '1.37.0'
	implementation group: 'io.grpc', name: 'grpc-protobuf', version: '1.37.0'
	implementation group: 'io.grpc', name: 'grpc-stub', version: '1.37.0'
	implementation group: 'com.google.protobuf', name: 'protobuf-java-util', version: '3.15.8'

	implementation group: 'net.devh', name: 'grpc-server-spring-boot-starter', version: '2.12.0.RELEASE'
	implementation group: 'net.devh', name: 'grpc-spring-boot-starter', version: '2.12.0.RELEASE'


	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
}

test {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

asciidoctor {
	inputs.dir snippetsDir
	dependsOn test
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.15.8'
	}

	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:1.37.0"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}